name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Unzip project (newest zip only)
        run: |
          ls -la
          # يُستخدم دائماً أحدث ملف zip رُفع إلى المستودع (وليس أول ملف أبجدياً)
          ZIP=""
          NEWEST=0
          for f in *.zip; do
            [ -e "$f" ] || continue
            T=$(git log -1 --format=%ct -- "$f" 2>/dev/null)
            T=${T:-0}
            if [ "$T" -ge "$NEWEST" ] && unzip -l "$f" | grep -q "package.json"; then NEWEST=$T; ZIP="$f"; fi
          done
          if [ -z "$ZIP" ]; then echo "::error::لا يوجد ملف مشروع zip يحتوي package.json"; exit 1; fi
          echo "Using $ZIP"
          rm -rf app
          unzip -o -q "$ZIP" -d app
          if [ -f app/package.json ]; then DIR=app; else DIR=$(dirname "$(ls app/*/package.json | head -n 1)"); fi
          echo "APP=$DIR" >> "$GITHUB_ENV"
          VER=$(grep -o "const APP_BUILD='[^']*'" "$DIR/www/index.html" | head -n 1)
          echo "ZIP المستخدم: $ZIP" >> "$GITHUB_STEP_SUMMARY"
          echo "إصدار التطبيق داخل الملف: $VER" >> "$GITHUB_STEP_SUMMARY"
          echo "$VER"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Install packages
        working-directory: ${{ env.APP }}
        run: npm install

      - name: Create Android project
        working-directory: ${{ env.APP }}
        run: npx cap add android

      - name: App icon and splash
        working-directory: ${{ env.APP }}
        run: npx @capacitor/assets generate --android
        continue-on-error: true

      - name: Sounds and permissions
        working-directory: ${{ env.APP }}
        run: node scripts/setup-android.js

      - name: Sync
        working-directory: ${{ env.APP }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ env.APP }}/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: albaqiyat-apk
          path: ${{ env.APP }}/android/app/build/outputs/apk/debug/app-debug.apk

